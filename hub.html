<!doctype html>
<html lang="en" data-theme="brave"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--r:8px;--font:Roboto,system-ui,"Segoe UI",sans-serif;--bg:#202124;--panel:#292a2d;--hover:#3c4043;--line:#3c4043;--tx:#e8eaed;--mut:#9aa0a6;--ac:#8ab4f8;--acx:#202124;--grid:none;--cdn:#81c995;--lock:#fdd663}
[data-theme=truffled]{--r:18px;--font:Poppins,system-ui,sans-serif;--bg:#131f1f;--panel:#1a2929;--hover:#243838;--line:#223434;--tx:#fff;--mut:#8fa3a3;--ac:#e8f5f2;--acx:#131f1f;--cdn:#7fe0c8;--grid:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px)}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:var(--bg);background-image:var(--grid);background-size:42px 42px;color:var(--tx);font:14px var(--font)}
#out{width:270px;flex:none;padding:18px 10px;overflow-y:auto;border-right:1px solid var(--line)}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 12px 10px}
.sec>a{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;color:var(--tx);text-decoration:none;cursor:pointer;border-left:3px solid transparent;border-radius:0 var(--r) var(--r) 0}
.sec>a span{color:var(--mut)}.sec>a:hover,.subs a:hover{background:var(--hover)}
.sec.on>a{border-left-color:var(--ac);color:var(--ac);font-weight:500}
.subs{display:none;padding:2px 0 6px 22px}.sec.open .subs{display:block}
.subs a{display:block;padding:4px 10px;color:var(--mut);font-size:13px;text-decoration:none;cursor:pointer;border-radius:var(--r);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;overflow-y:auto;padding:36px 110px 60px 40px;scroll-behavior:smooth}
.page{max-width:860px;margin:0 auto}h1{font-size:52px;font-weight:600;margin:10px 0 18px;text-align:center}
#q{display:block;width:100%;max-width:640px;margin:0 auto 34px;padding:16px 22px;border-radius:calc(var(--r)*2.5);border:0;background:var(--panel);color:var(--tx);font:inherit;font-size:16px;outline:none;text-align:center}
section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:22px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{margin:0;font-size:20px;font-weight:600}
h3{margin:16px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:500}.note{color:var(--mut);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer}
.chip{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px}.chip:hover{background:var(--hover)}
.sh button,#set button.on{background:var(--ac);color:var(--acx);border:0;border-radius:var(--r);padding:7px 16px;font-weight:500}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--hover);color:var(--lock)}
.hl{outline:2px solid var(--ac)}
.game{padding:12px 0;border-top:1px solid var(--line)}.game:first-of-type{border-top:0}.game b{font-size:15px}.game p{margin:4px 0 8px;color:var(--mut)}.game button{margin-right:6px;background:var(--hover);color:var(--tx);border:0;border-radius:var(--r);padding:6px 14px}
#rail{position:fixed;right:14px;top:50%;transform:translateY(-50%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px}
#rail button{background:none;border:0;color:var(--tx);width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center}
#rail button:hover{background:var(--hover)}#rail svg{width:24px;height:24px;fill:currentColor}
#set{display:none;position:fixed;right:84px;top:50%;transform:translateY(-50%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:210px}
#set.show{display:block}#set b{display:block;margin-bottom:10px}#set button{display:block;width:100%;margin-bottom:6px;padding:8px;background:var(--hover);color:var(--tx);border:0;border-radius:var(--r);text-align:left}
#toast{display:none;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 18px}#toast.show{display:block}
@media(max-width:760px){#out{display:none}#main{padding:16px 76px 40px 16px}}
</style></head><body>
