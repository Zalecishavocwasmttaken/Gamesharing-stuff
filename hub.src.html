.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 12px 10px}
.sec>a{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;color:var(--tx);text-decoration:none;cursor:pointer;border-left:3px solid transparent;border-radius:0 var(--r) var(--r) 0}

.subs{display:none;padding:2px 0 6px 22px}.sec.open .subs{display:block}
.subs a{display:block;padding:4px 10px;color:var(--mut);font-size:13px;text-decoration:none;cursor:pointer;border-radius:var(--r);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.page{max-width:860px;margin:0 auto}h1{font-size:52px;font-weight:600;margin:10px 0 18px;text-align:center}

.sh{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{margin:0;font-size:20px;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer}
.chip{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px}.chip:hover{background:var(--hover)}
.sh button,#set button.on{background:var(--ac);color:var(--acx);border:0;border-radius:var(--r);padding:7px 16px;font-weight:500}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--hover);color:var(--lock)}
.hl{outline:2px solid var(--ac)}

#rail button:hover{background:var(--hover)}#rail svg{width:24px;height:24px;fill:currentColor}

 w.document.open();w.document.write(`<!doctype html><html><head>${csp}<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head><body></body></html>`);w.document.close();
 f.setAttribute("sandbox",lock?SB_LOCK:SB_OPEN);f.setAttribute("allow","fullscreen; autoplay; clipboard-write; gamepad");f.src=url;w.document.body.appendChild(f);
}

async function openClean(pref){
 const w=window.open("about:blank","_blank");
 if(!w){alert("Popup blocked. Allow popups for this page.");return}
 w.opener=null;
 if(!guard(w))return;
 w.document.write("<body style='margin:0;background:#202124;color:#9aa0a6;font:14px sans-serif;padding:20px'>Loading...");
 const order=Object.keys(MIRRORS);
 if(MIRRORS[pref])order.unshift(...order.splice(order.indexOf(pref),1));
 let txt;
 for(const m of order){
  try{const r=await fetch(MIRRORS[m](m)+"?t="+Date.now(),{cache:"no-store",signal:AbortSignal.timeout(8000)});if(!r.ok)throw 0;txt=await r.text();break}catch(e){}
 }
 if(!txt){w.document.body.textContent="All mirrors failed to fetch.";return}
 if(dead){w.close();return}
 const cfg={sel:HIDE_SELECTORS,tab:HIDE_TAB,urls:HIDE_URL_TEXT};
 const head=`<script>(${hider})(${JSON.stringify(cfg)})<\/script>`;
 let doc=txt.replace(/<head[^>]*>/i,m=>m+head);
 if(doc===txt)doc=head+txt;
 w.document.open();
 w.document.write("<!doctype html><html><head><style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head><body></body></html>");
 w.document.close();
 const f=w.document.createElement("iframe");
 f.setAttribute("sandbox",SB_OPEN);
 f.setAttribute("allow","fullscreen; autoplay; clipboard-write; gamepad");
 f.srcdoc=doc;
 w.document.body.appendChild(f);
}

let tt;
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),1800)}
async function copyLink(){
 if(!guard())return;
 const u=location.href;
 try{await navigator.clipboard.writeText(u)}catch(e){const t=document.createElement("textarea");t.value=u;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
 toast("Link copied");
}
function cloakSelf(){
 const w=window.open("about:blank","_blank");if(!w){alert("Popup blocked. Allow popups for this page.");return}
 if(!guard(w))return;
 w.document.open();
 w.document.write(`<!doctype html><html><head><style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head><body><iframe src="${location.href}" allow="fullscreen; autoplay; clipboard-write; gamepad"></iframe></body></html>`);
 w.document.close();
}
async function pageSource(){
 if(dead)return "";
 try{const r=await fetch(location.href,{cache:"no-store"});if(r.ok)return await r.text()}catch(e){}
 return "<!doctype html>"+document.documentElement.outerHTML;
}
function save(name,type,data){
 if(dead)return;
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const b64=s=>{const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)};
async function exportHtml(){if(!guard())return;save("hub.html","text/html",await pageSource())}
async function exportSvg(){
 if(!guard())return;
 const d=b64(await pageSource());
 save("hub.svg","image/svg+xml",`<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="#202124"/><text x="50%" y="50%" fill="#9aa0a6" font-family="sans-serif" font-size="16" text-anchor="middle">Click to open</text><script><![CDATA[const d="${d}";document.documentElement.addEventListener("click",()=>{const w=open("about:blank","_blank");if(!w)return;w.document.open();w.document.write(new TextDecoder().decode(Uint8Array.from(atob(d),c=>c.charCodeAt(0))));w.document.close()});]]><\/script></svg>`);
}

const $=s=>document.querySelector(s),main=$("#main"),toc=$("#toc"),q=$("#q");
const G=["jsDelivr mirrors","Other CDNs","Direct sites"],gi=t=>t<2?0:t-1;
let h="",t="";
SITES.forEach(s=>{
 h+=`<section id="${s.id}"><div class="sh"><h2>${s.title}</h2><button data-s="${s.id}" data-i="0">Open best</button></div>${s.note?`<p class="note">${s.lock?'<span class="tag">locked</span> ':""}${s.note}</p>`:""}`;
 t+=`<div class="sec" data-id="${s.id}"><a data-go="${s.id}">${s.title.split(" (")[0]}<span>${s.links.length}</span></a><div class="subs">`;
 G.forEach((g,n)=>{const L=s.links.map((k,i)=>({...k,i})).filter(k=>gi(k.t)===n);if(!L.length)return;
  h+=`<h3>${g}</h3><div class="chips">${L.map(k=>`<button class="chip" id="${s.id}-${k.i}" data-s="${s.id}" data-i="${k.i}">${k.l}</button>`).join("")}</div>`;
  t+=L.map(k=>`<a data-go="${s.id}-${k.i}">${k.l}</a>`).join("")});
 h+="</section>";t+="</div></div>"});
h+=`<section id="games"><div class="sh"><h2>What site for what game?</h2></div>`+GAMES.map(([g,x,ids])=>`<div class="game"><b>${g}</b><p>${x}</p>${ids.map(i=>`<button data-go="${i}">${SITES.find(s=>s.id===i).title.split(" (")[0]}</button>`).join("")}</div>`).join("")+"</section>";
t+=`<div class="sec" data-id="games"><a data-go="games">What site for what game?</a></div>`;
$("#content").innerHTML=h;toc.innerHTML=t;
const go=id=>{if(dead)return;const e=document.getElementById(id);if(e){e.scrollIntoView();if(e.classList.contains("chip")){e.classList.add("hl");setTimeout(()=>e.classList.remove("hl"),1200)}}};
function setTheme(v){if(dead)return;document.documentElement.dataset.theme=v;document.querySelectorAll("#set [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===v));try{localStorage.setItem("hub-theme",v)}catch(e){}}
let saved="brave";try{saved=localStorage.getItem("hub-theme")||"brave"}catch(e){}
setTheme(saved);
document.addEventListener("click",e=>{
 if(dead)return;
 const b=e.target.closest("[data-s]");if(b){const s=SITES.find(x=>x.id===b.dataset.s),u=s.links[b.dataset.i].u;if(s.id==="uz")openClean(host(u));else openCloak(u,!!s.lock);return}
 const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
 const dl=e.target.closest("[data-dl]");if(dl){if(dl.dataset.dl==="svg")exportSvg();else exportHtml();return}
 const th=e.target.closest("[data-t]");if(th){setTheme(th.dataset.t);return}
 const a=e.target.closest("[data-act]");if(a){const v=a.dataset.act;if(v==="set")$("#set").classList.toggle("show");else if(v==="games")go("games");else if(v==="share")copyLink();else if(v==="cloak")cloakSelf();else main.scrollTo(0,0);return}
 if(!e.target.closest("#set"))$("#set").classList.remove("show")});
function spy(){if(dead)return;let cur=null;document.querySelectorAll("section").forEach(s=>{if(s.getBoundingClientRect().top<160)cur=s.id});
 document.querySelectorAll(".sec").forEach(x=>{const on=x.dataset.id===cur;x.classList.toggle("on",on);if(!q.value)x.classList.toggle("open",on)})}
main.addEventListener("scroll",spy);
q.addEventListener("input",()=>{if(dead)return;const v=q.value.toLowerCase();
 document.querySelectorAll(".chip").forEach(c=>c.style.display=c.textContent.toLowerCase().includes(v)?"":"none");
 document.querySelectorAll(".subs a").forEach(a=>a.style.display=a.textContent.toLowerCase().includes(v)?"":"none");
 document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("open",!!v))});
spy();
verify();
tick=setInterval(verify,60000);
window.addEventListener("focus",verify);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)verify()});
